# Detects changes to the OpenDART developer guide, FAQ, notices and API
# change notices by regenerating spec/guide-snapshot.json.
#
# - schedule / manual run: opens an issue (or updates the open one) with the
#   snapshot diff when it changed, and closes it once the committed snapshot
#   matches again. A green run with no open issue means no change. Pages
#   that do not look like the guide (maintenance, new markup) fail the run
#   instead of producing a partial snapshot.
# - pull_request touching the script or snapshot: fails if the committed
#   snapshot is out of date.
name: Guide watch

on:
  schedule:
    - cron: "17 0 * * *" # 09:17 KST
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/fetch_guide.py
      - spec/guide-snapshot.json
      - .github/workflows/guide-watch.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I scripts/fetch_guide.py --snapshot-only --snapshot spec/guide-snapshot.json
      - name: Check the committed snapshot
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- spec/guide-snapshot.json
      - name: Report changes in an issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="OpenDART guide changed"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if git diff --quiet -- spec/guide-snapshot.json; then
            echo "No change in the guide snapshot."
            # The committed snapshot caught up (or the change was reverted).
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "The [guide watch run]($RUN_URL) matches the committed snapshot again."
            fi
            exit 0
          fi
          {
            echo "The [guide watch run]($RUN_URL) found changes in \`spec/guide-snapshot.json\`."
            echo
            echo "Regenerate it with \`python3 -I scripts/fetch_guide.py guide --snapshot spec/guide-snapshot.json\`, read the changed pages in \`guide/\`, update the client if an endpoint changed, and commit the new snapshot in a pull request that closes this issue."
            echo
            echo '```diff'
            git diff -- spec/guide-snapshot.json | head -c 50000
            echo '```'
          } > body.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
