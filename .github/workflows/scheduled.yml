# Checks that can fail without any change in this repository.
name: Scheduled

on:
  schedule:
    - cron: "23 1 * * *" # daily 10:23 KST: security advisories, key scan
    - cron: "41 1 * * 1" # Mondays 10:41 KST: live API tests
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # New RustSec advisories appear without a push or a pull request.
  advisories:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 1 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories

  # CI's grep only catches key-shaped assignments; this looks for the key
  # itself in every commit and in the tree (fixtures included). Never run it
  # on pull_request: workflows from forks get an empty secret.
  key-scan:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 1 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Search the history for the API key
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          if [ -z "$OPENDART_API_KEY" ]; then
            echo "::error::OPENDART_API_KEY is not set"
            exit 1
          fi
          if git grep -qF -e "$OPENDART_API_KEY" || git log --all -p --format= | grep -qF -e "$OPENDART_API_KEY"; then
            echo "::error::The OpenDART API key is in the repository. Revoke it on opendart.fss.or.kr and issue a new one."
            exit 1
          fi

  # Real responses can change before the guide does. Eleven requests a week
  # against the key's daily quota, which quant's watcher shares.
  live:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 1 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # One request at a time: from the US, OpenDART answers in about 3 s.
      - run: cargo test --all-features --test live -- --ignored --test-threads=1
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
