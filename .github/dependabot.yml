version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait a week before adopting a new release, in case it was compromised.
    cooldown:
      default-days: 7
    # Public dependencies: a breaking bump of either is a breaking opendart
    # release, so it is done by hand. For 0.x crates the minor number is the
    # breaking one.
    ignore:
      - dependency-name: reqwest
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: jiff
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before adopting a new release, in case it was compromised.
    cooldown:
      default-days: 7
