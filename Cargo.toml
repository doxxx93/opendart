[package]
name = "opendart"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Typed client for OpenDART, the electronic disclosure (DART) API of Korea's Financial Supervisory Service"
license = "MIT OR Apache-2.0"
repository = "https://github.com/doxxx93/opendart"
readme = "README.md"
keywords = ["opendart", "dart", "korea", "disclosure", "finance"]
categories = ["api-bindings", "finance"]
include = ["/src", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
jiff = { version = "1", default-features = false, features = ["std"] }
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["rustls"]
# TLS backend for reqwest. For native-tls only, use `default-features = false, features = ["native-tls"]`.
rustls = ["reqwest/rustls"]
# rustls without a crypto provider; install one (e.g. ring) before creating a `Client`.
rustls-no-provider = ["reqwest/rustls-no-provider"]
native-tls = ["reqwest/native-tls"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
